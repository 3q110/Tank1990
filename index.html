<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Battle City</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255, 215, 0, 0.10), transparent 60%),
      radial-gradient(900px 500px at 85% 110%, rgba(231, 76, 60, 0.08), transparent 55%),
      linear-gradient(180deg, #0b0b12 0%, #0a0a0a 40%, #050505 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    user-select: none;
  }

  /* Subtle animated scanline overlay for retro feel */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 2px,
      transparent 4px
    );
    z-index: 1;
    opacity: 0.5;
  }

  #game-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 2;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 840px;
    padding: 8px 16px;
    background: linear-gradient(180deg, rgba(30,30,55,0.95) 0%, rgba(15,15,30,0.95) 100%);
    border: 2px solid rgba(255, 215, 0, 0.35);
    border-radius: 8px;
    color: #fff;
    font-size: 10px;
    letter-spacing: 1px;
    box-shadow: 0 0 22px rgba(255, 215, 0, 0.12), inset 0 0 18px rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
  }

  #hud .hud-left, #hud .hud-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .hud-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .hud-item .label {
    color: #9aa;
    font-size: 8px;
    letter-spacing: 1px;
  }
  .hud-item .value {
    color: #FFD700;
    text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    font-size: 11px;
  }

  .hud-mute {
    font-family: inherit;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 6px;
    font-size: 14px;
    line-height: 1;
    padding: 5px 8px;
    cursor: pointer;
    color: #fff;
    transition: all 0.15s ease;
  }
  .hud-mute:hover { border-color: #FFD700; background: rgba(255,215,0,0.12); }
  .hud-mute.muted { opacity: 0.5; }

  .hud-enemy-icon {
    width: 12px; height: 12px;
    background: #e74c3c;
    clip-path: polygon(20% 0%, 80% 0%, 100% 30%, 100% 70%, 80% 100%, 20% 100%, 0% 70%, 0% 30%);
    display: inline-block;
  }

  .hud-lives-icon {
    width: 12px; height: 12px;
    background: #FFD700;
    clip-path: polygon(50% 0%, 80% 30%, 80% 100%, 50% 80%, 20% 100%, 20% 30%);
    display: inline-block;
  }

  #game-container {
    position: relative;
    border: 3px solid rgba(255, 215, 0, 0.25);
    border-radius: 8px;
    box-shadow:
      0 0 50px rgba(255, 215, 0, 0.18),
      0 0 120px rgba(231, 76, 60, 0.08),
      inset 0 0 20px rgba(0,0,0,0.5);
    background: #0a0a0a;
  }

  #gameCanvas {
    display: block;
    background: #111;
    image-rendering: pixelated;
    border-radius: 6px;
  }

  #menu-overlay, #gameover-overlay, #level-complete-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.85);
    z-index: 10;
    backdrop-filter: blur(3px);
  }

  #menu-overlay {
    background:
      radial-gradient(700px 400px at 50% 30%, rgba(255, 215, 0, 0.10), transparent 70%),
      linear-gradient(180deg, rgba(5,5,15,0.94) 0%, rgba(12,10,30,0.96) 100%);
  }

  #gameover-overlay, #level-complete-overlay { display: none; }

  .menu-title {
    font-size: 32px;
    color: #FFD700;
    text-shadow: 0 0 14px rgba(255, 215, 0, 0.55), 0 0 30px rgba(255,140,0,0.25), 0 4px 0 #8B6914;
    margin-bottom: 10px;
    letter-spacing: 5px;
    animation: titlePulse 2s ease-in-out infinite;
  }

  .menu-subtitle {
    font-size: 10px;
    color: #889;
    margin-bottom: 50px;
    letter-spacing: 4px;
  }

  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 4px 0 #8B6914; }
    50% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 4px 0 #8B6914; }
  }

  .menu-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: #dfe6ff;
    background: linear-gradient(180deg, rgba(40,40,70,0.6) 0%, rgba(20,20,40,0.7) 100%);
    border: 2px solid rgba(120,120,160,0.4);
    border-radius: 8px;
    padding: 15px 36px;
    margin: 9px;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-width: 300px;
    text-align: center;
    letter-spacing: 2px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }

  .menu-btn::after {
    content: "";
    position: absolute;
    top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.14), transparent);
    transform: skewX(-20deg);
    transition: left 0.5s ease;
  }

  .menu-btn:hover {
    border-color: #FFD700;
    color: #FFD700;
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 0 24px rgba(255, 215, 0, 0.28), 0 6px 18px rgba(0,0,0,0.5);
    background: linear-gradient(180deg, rgba(60,55,30,0.7) 0%, rgba(35,30,18,0.8) 100%);
  }
  .menu-btn:hover::after { left: 130%; }
  .menu-btn:active { transform: translateY(0) scale(0.99); }

  .campaign-toggle {
    margin-top: 22px;
    padding: 10px 14px;
    background: rgba(255, 215, 0, 0.08);
    border: 1px solid rgba(255, 215, 0, 0.4);
    border-radius: 4px;
    color: #FFD700;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    letter-spacing: 1px;
  }
  .campaign-toggle input { accent-color: #FFD700; width: 16px; height: 16px; cursor: pointer; }

  .menu-btn .btn-key {
    display: inline-block;
    margin-right: 12px;
    color: #e74c3c;
    font-size: 10px;
  }

  .controls-info {
    position: absolute;
    bottom: 60px;
    color: #555;
    font-size: 7px;
    text-align: center;
    line-height: 2;
    letter-spacing: 1px;
  }

  .controls-info span { color: #888; }

  .gameover-title {
    font-size: 30px;
    color: #ff5252;
    text-shadow: 0 0 18px rgba(231, 76, 60, 0.7), 0 0 40px rgba(231,76,60,0.3);
    margin-bottom: 22px;
    letter-spacing: 4px;
    animation: goPulse 1.6s ease-in-out infinite;
  }

  @keyframes goPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .level-complete-title {
    font-size: 22px;
    color: #4dff88;
    text-shadow: 0 0 18px rgba(46, 204, 113, 0.7), 0 0 40px rgba(46,204,113,0.3);
    margin-bottom: 22px;
    letter-spacing: 4px;
  }

  .result-score {
    color: #cfd6ff;
    font-size: 12px;
    margin: 12px 0;
    letter-spacing: 1px;
  }

  .result-score .score-val {
    color: #FFD700;
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
  }

  .stage-select {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    background: rgba(0, 0, 0, 0.92);
    z-index: 20;
    overflow-y: auto;
    padding: 30px 10px;
  }

  .stage-select-title {
    color: #FFD700;
    font-size: 12px;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }

  .stage-buttons-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
    max-width: 420px;
    padding: 0 10px;
  }

  .stage-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #aaa;
    background: transparent;
    border: 2px solid #333;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    line-height: 1.4;
  }

  .stage-btn:hover, .stage-btn:active {
    border-color: #FFD700;
    color: #FFD700;
  }

  .stage-btn .stage-num {
    color: #FFD700;
    font-size: 11px;
  }

  .stage-btn .stage-theme {
    color: #666;
    font-size: 7px;
  }

  .stage-back-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #e74c3c;
    background: transparent;
    border: 2px solid #e74c3c;
    padding: 10px 30px;
    margin-top: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .stage-back-btn:hover, .stage-back-btn:active {
    background: rgba(231, 76, 60, 0.1);
    color: #ff6b6b;
  }

  .difficulty-buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 360px;
    padding: 0 10px;
    margin-bottom: 20px;
  }

  .difficulty-btn {
    min-width: 0;
    width: 100%;
    max-width: 300px;
    margin: 0;
  }

  .difficulty-btn:hover {
    border-color: #FFD700;
    color: #FFD700;
  }

  .difficulty-btn .btn-key {
    font-size: 9px;
  }

  .p1-indicator {
    color: #FFD700;
    font-size: 8px;
    margin-top: 15px;
    animation: blink 0.5s step-end infinite;
  }

  .p2-indicator {
    color: #2ecc71;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .powerup-indicator {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 7px;
    color: #FFD700;
    background: rgba(0,0,0,0.7);
    padding: 3px 8px;
    border: 1px solid #FFD700;
    border-radius: 2px;
    display: none;
    white-space: nowrap;
    z-index: 5;
  }

  #touch-controls {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 160px;
    z-index: 100;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #joystick-zone {
    position: absolute;
    bottom: 20px;
    left: 24px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.02) 100%);
    border: 2px solid rgba(255,215,0,0.35);
    box-shadow: inset 0 0 26px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.10);
    pointer-events: auto;
    touch-action: none;
    z-index: 105;
  }

  .joy-arrow {
    position: absolute;
    color: rgba(255,215,0,0.45);
    font-size: 13px;
    pointer-events: none;
  }
  .joy-arrow.up { top: 8px; left: 50%; transform: translateX(-50%); }
  .joy-arrow.down { bottom: 8px; left: 50%; transform: translateX(-50%); }
  .joy-arrow.left { left: 10px; top: 50%; transform: translateY(-50%); }
  .joy-arrow.right { right: 10px; top: 50%; transform: translateY(-50%); }

  #joystick-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255,235,150,0.95) 0%, rgba(255,215,0,0.85) 55%, rgba(184,134,11,0.85) 100%);
    border: 2px solid rgba(255,240,180,0.8);
    box-shadow: 0 3px 12px rgba(0,0,0,0.5), 0 0 16px rgba(255,215,0,0.35);
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: none;
    z-index: 106;
  }

  #touch-pause {
    position: absolute;
    bottom: 108px;
    right: 40px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    font-size: 16px;
    border: 2px solid rgba(255,215,0,0.45);
    background: rgba(255,215,0,0.12);
    color: #FFD700;
    pointer-events: auto;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    z-index: 112;
    transition: transform 0.08s, background 0.08s;
  }
  #touch-pause:active { transform: scale(0.92); background: rgba(255,215,0,0.28); }

  #touch-fire {
    position: absolute;
    bottom: 26px;
    right: 28px;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    font-size: 14px;
    border: 3px solid rgba(255, 80, 80, 0.75);
    background: radial-gradient(circle at 40% 35%, rgba(255,120,120,0.4) 0%, rgba(255,50,50,0.28) 60%, rgba(200,30,30,0.22) 100%);
    color: #ffb3b3;
    pointer-events: auto;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    transition: background 0.08s, transform 0.08s, box-shadow 0.08s;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 1px;
    font-family: 'Press Start 2P', monospace;
    box-shadow: 0 0 22px rgba(255,60,60,0.25);
    z-index: 110;
  }

  #touch-fire:active, #touch-fire.active {
    background: radial-gradient(circle at 40% 35%, rgba(255,160,160,0.6) 0%, rgba(255,70,70,0.5) 60%, rgba(230,40,40,0.45) 100%);
    border-color: rgba(255, 120, 120, 0.98);
    transform: scale(0.92);
    box-shadow: 0 0 30px rgba(255,80,80,0.5);
  }

  @media (max-width: 850px), (pointer: coarse) {
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      width: 100%;
      border-radius: 0;
      font-size: 8px;
      padding: 6px 10px;
      z-index: 50;
    }

    #game-wrapper {
      padding-top: 0;
      width: 100%;
    }

    body {
      align-items: flex-start;
      padding-top: 40px;
      overflow: auto;
    }

    #touch-controls {
      display: block;
    }

    .controls-info {
      display: none;
    }
  }

  @media (max-width: 850px) {
    #game-container {
      transform-origin: top center;
      margin: 0 auto;
    }

    .menu-btn {
      min-width: 0;
      width: 90%;
      max-width: 280px;
      font-size: 11px;
      padding: 12px 20px;
    }

    .menu-title {
      font-size: 22px;
    }

    .menu-subtitle {
      margin-bottom: 30px;
    }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="hud">
    <div class="hud-left">
      <div class="hud-item">
        <span class="hud-lives-icon"></span>
        <span class="value" id="lives-display">3</span>
      </div>
      <div class="hud-item">
        <span class="label">STAGE</span>
        <span class="value" id="stage-display">1</span>
      </div>
    </div>
    <div class="hud-right">
      <div class="hud-item">
        <span class="label">SCORE</span>
        <span class="value" id="score-display">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-enemy-icon"></span>
        <span class="value" id="enemies-display">20</span>
      </div>
      <div class="hud-item">
        <button id="mute-btn" class="hud-mute" title="Mute (M)">🔊</button>
      </div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="780" height="780"></canvas>
    <div id="powerup-indicator" class="powerup-indicator"></div>

    <div id="menu-overlay">
      <div class="menu-title">坦克大战</div>
      <div class="menu-subtitle">BATTLE CITY</div>

      <button class="menu-btn" onclick="showDifficultySelect(0,false)">
        <span class="btn-key">[1P]</span> 1 PLAYER
      </button>
      <button class="menu-btn" onclick="showDifficultySelect(0,true)">
        <span class="btn-key">[2P]</span> 2 PLAYERS
      </button>
      <button class="menu-btn" onclick="showStageSelect()">
        <span class="btn-key">[STAGE]</span> SELECT STAGE
      </button>

      <div class="controls-info">
        <span>[WASD] P1移动 &nbsp; [J]射击 &nbsp; [P]暂停</span>
        <br>
        <span>[↑↓←→] P2移动 &nbsp; [小键盘0]射击</span>
      </div>
    </div>

    <div id="gameover-overlay">
      <div class="gameover-title">GAME OVER</div>
      <div class="result-score">FINAL SCORE: <span class="score-val" id="final-score">0</span></div>
      <div class="result-score">STAGE REACHED: <span class="score-val" id="final-stage">1</span></div>
      <button class="menu-btn" onclick="backToMenu()">MENU</button>
    </div>

    <div id="level-complete-overlay">
      <div class="level-complete-title">STAGE CLEAR!</div>
      <div class="result-score">SCORE: <span class="score-val" id="stage-score">0</span></div>
      <button class="menu-btn" onclick="nextLevel()">NEXT STAGE</button>
    </div>

    <div id="stage-select" class="stage-select">
      <div class="stage-select-title">SELECT STAGE</div>
      <div id="stage-buttons" class="stage-buttons-grid"></div>
      <button class="stage-back-btn" onclick="backToMenu()">← BACK</button>
      <div class="p1-indicator">★ P1 SELECT</div>
    </div>

    <div id="difficulty-select" class="stage-select">
      <div class="stage-select-title">选择难度</div>
      <div class="difficulty-buttons">
        <button class="menu-btn difficulty-btn" onclick="startWithDifficulty('easy')">
          <span class="btn-key">[EASY]</span> 简单
        </button>
        <button class="menu-btn difficulty-btn" onclick="startWithDifficulty('medium')">
          <span class="btn-key">[NORMAL]</span> 普通
        </button>
        <button class="menu-btn difficulty-btn" onclick="startWithDifficulty('hard')">
          <span class="btn-key">[HARD]</span> 困难
        </button>
      </div>
      <label class="campaign-toggle">
        <input type="checkbox" id="campaign-toggle" checked />
        单人闯关模式（生命/洋枪跨关保留，从当前关连续打到最后一关）
      </label>
      <button class="stage-back-btn" onclick="backToMenu()">← BACK</button>
    </div>
  </div>

  <div id="touch-controls">
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
      <span class="joy-arrow up">▲</span>
      <span class="joy-arrow down">▼</span>
      <span class="joy-arrow left">◀</span>
      <span class="joy-arrow right">▶</span>
    </div>
    <button id="touch-pause" title="Pause">❚❚</button>
    <button id="touch-fire">FIRE</button>
  </div>
</div>

<script>
// ============================================================
// CONSTANTS
// ============================================================
const COLS = 26;
const ROWS = 26;
const CELL = 30;
const W = COLS * CELL;
const H = ROWS * CELL;

const TILE = { EMPTY: 0, BRICK: 1, STEEL: 2, FOREST: 3, WATER: 4, BASE: 5, BASE_WALL: 6, SNOW: 7, DESERT: 8 };
const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const STATE = { MENU: 0, PLAYING: 1, LEVEL_COMPLETE: 2, GAME_OVER: 3, PAUSED: 4 };

const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

const ENEMY_TYPE = {
  NORMAL: 0,
  FAST: 1,
  ARMOR: 2
};

const POWERUP = {
  LIGHTNING: 'lightning',
  SUPER_BULLET: 'superBullet',
  STAR: 'star',
  BOMB: 'bomb',
  TIMER: 'timer',
  HORN: 'horn'
};

// ============================================================
// LEVEL DEFINITIONS & THEMES
// ============================================================
const THEMES = [
  { name: '标准', bg: '#1a1a1a', wallColor: '#8B4513', forestColor: '#228B22', waterColor: '#1E90FF', floorColor: '#2a2a2a', brickAlt: '#A0522D' },
  { name: '丛林', bg: '#0d1f0d', wallColor: '#5C4033', forestColor: '#006400', waterColor: '#006994', floorColor: '#1a2e1a', brickAlt: '#6B4423' },

// ============================================================
// SOUND ENGINE — layered Web Audio synthesis
// Master gain + compressor, noise buffers, per-sound layering.
// ============================================================
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.master = null;
    this.noiseBuf = null;
    this.muted = false;
  }

  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      // Master gain -> compressor -> destination (prevents clipping when many SFX overlap)
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 24;
      comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      // Pre-render a reusable 1.2s white-noise buffer
      const len = Math.floor(this.ctx.sampleRate * 1.2);
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) {
      this.enabled = false;
    }
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  setMuted(m) {
    this.muted = !!m;
    if (this.master && this.ctx) {
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.linearRampToValueAtTime(m ? 0 : 0.9, this.ctx.currentTime + 0.05);
    }
  }

  play(type) {
    if (!this.enabled || !this.ctx || this.muted) return;
    this.resume();
    const fn = this['_' + type];
    if (fn) fn.call(this);
  }

  // --- low-level helpers -------------------------------------------------
  _tone({ type = 'square', freq = 440, freqEnd = null, start = 0, dur = 0.1, vol = 0.1, filter = null, filterFreq = null }) {
    const t0 = this.ctx.currentTime + start;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    let node = o;
    if (filter) {
      const f = this.ctx.createBiquadFilter();
      f.type = filter; if (filterFreq) f.frequency.value = filterFreq;
      o.connect(f); node = f;
    }
    node.connect(g); g.connect(this.master);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  _noise({ start = 0, dur = 0.3, vol = 0.2, filter = 'lowpass', filterFreq = 800, sweepTo = null }) {
    const t0 = this.ctx.currentTime + start;
    const s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf; s.loop = false;
    const f = this.ctx.createBiquadFilter();
    f.type = filter; f.frequency.setValueAtTime(filterFreq, t0);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(20, sweepTo), t0 + dur);
    const g = this.ctx.createGain();
    s.connect(f); f.connect(g); g.connect(this.master);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.start(t0); s.stop(t0 + dur + 0.05);
  }

  // --- individual sounds -------------------------------------------------
  _shoot() {
    this._tone({ type: 'square', freq: 900, freqEnd: 180, dur: 0.09, vol: 0.11 });
    this._noise({ dur: 0.05, vol: 0.05, filter: 'highpass', filterFreq: 2500 });
  }

  _superShoot() {
    this._tone({ type: 'sawtooth', freq: 1400, freqEnd: 320, dur: 0.13, vol: 0.12 });
    this._tone({ type: 'square', freq: 2100, freqEnd: 700, dur: 0.09, vol: 0.06 });
    this._noise({ dur: 0.08, vol: 0.06, filter: 'bandpass', filterFreq: 3000 });
  }

  _explosion() {
    this._noise({ dur: 0.45, vol: 0.4, filter: 'lowpass', filterFreq: 1200, sweepTo: 120 });
    this._tone({ type: 'sine', freq: 120, freqEnd: 40, dur: 0.4, vol: 0.3 });
    this._tone({ type: 'triangle', freq: 60, freqEnd: 30, dur: 0.5, vol: 0.18 });
  }

  _hit() {
    this._tone({ type: 'sawtooth', freq: 500, freqEnd: 120, dur: 0.09, vol: 0.09 });
    this._noise({ dur: 0.05, vol: 0.05, filter: 'lowpass', filterFreq: 2000 });
  }

  _powerup() {
    this._tone({ type: 'sine', freq: 500, freqEnd: 1600, dur: 0.28, vol: 0.08 });
    this._tone({ type: 'square', freq: 700, freqEnd: 2000, dur: 0.28, vol: 0.04, start: 0.02 });
    this._tone({ type: 'sine', freq: 1600, freqEnd: 2400, dur: 0.18, vol: 0.05, start: 0.18 });
  }

  _gameover() {
    [392, 330, 262, 196].forEach((f, i) => {
      this._tone({ type: 'square', freq: f, dur: 0.22, vol: 0.1, start: i * 0.22 });
      this._tone({ type: 'sawtooth', freq: f / 2, dur: 0.22, vol: 0.05, start: i * 0.22 });
    });
  }

  _levelUp() {
    [523, 659, 784, 1047, 1319].forEach((f, i) => {
      this._tone({ type: 'sine', freq: f, dur: 0.14, vol: 0.08, start: i * 0.09 });
      this._tone({ type: 'triangle', freq: f * 1.5, dur: 0.1, vol: 0.03, start: i * 0.09 });
    });
  }

  _move() {
    if (Math.random() > 0.1) return;
    this._tone({ type: 'triangle', freq: 120, dur: 0.04, vol: 0.02 });
  }

  _freeze() {
    this._tone({ type: 'sine', freq: 700, freqEnd: 250, dur: 0.5, vol: 0.07 });
    this._tone({ type: 'sine', freq: 1000, freqEnd: 400, dur: 0.6, vol: 0.04, start: 0.1 });
    this._noise({ dur: 0.4, vol: 0.03, filter: 'highpass', filterFreq: 4000 });
  }

  _spawn() {
    this._tone({ type: 'square', freq: 200, freqEnd: 800, dur: 0.15, vol: 0.05 });
  }

  _select() {
    this._tone({ type: 'square', freq: 660, dur: 0.05, vol: 0.06 });
  }
}

const sound = new SoundEngine();

// ============================================================
// GAME CLASS
// ============================================================
class BattleCity {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.state = STATE.MENU;
    this.level = 0;
    this.score = 0;
    this.lives = 3;
    this.doubleMode = false;
    this.map = [];
    this.theme = null;
    this.player1 = null;
    this.player2 = null;
    this.enemies = [];
    this.bullets = [];
    this.particles = [];
    this.powerups = [];
    this.keys = {};
    this.frameCount = 0;
    this.lastTime = 0;
    this.enemySpawnTimer = 0;
    this.maxEnemies = 4;
    this.totalEnemies = 0;
    this.enemiesSpawned = 0;
    this.enemySpawnPoints = [{x:0,y:0},{x:12,y:0},{x:24,y:0}];
    this.powerupTimer = 0;
    this.powerupInterval = 400;
    this.spawnAnimations = [];
    this.shakeX = 0; this.shakeY = 0; this.shakeT = 0; this.shakeMax = 1; this.shakeAmp = 0; this.acc = 0;

    this.freezeTimer = 0;
    this.hornTimer = 0;
    this.timerItemActive = false;
    this.powerupIndicator = document.getElementById('powerup-indicator');
    this.container = document.getElementById('game-container');
    this.difficulty = 'medium';
    this.campaignMode = true;        // 单人闯关模式（默认开启）
    this.campaignScore = 0;          // 跨关累计分数
    this.campaignLives = 3;          // 跨关保留生命
    this.campaignP1Super = false;    // 跨关保留 P1 洋枪
    this.campaignP2Super = false;    // 跨关保留 P2 洋枪

    this.handleResize = this.handleResize.bind(this);
    window.addEventListener('resize', this.handleResize);

    this.init();
  }

  handleResize() {
    const isMobile = window.innerWidth <= 850 || 'ontouchstart' in window;
    if (isMobile) {
      const maxW = window.innerWidth - 16;
      const maxH = window.innerHeight - 160;
      const scale = Math.min(1, maxW / W, maxH / H);
      this.container.style.transform = 'scale(' + scale + ')';
      this.container.style.transformOrigin = 'top center';
    } else {
      this.container.style.transform = '';
    }
  }

  init() {
    this.setupInput();
    this.handleResize();
    this.bindMuteButton();
    this.bindPauseButton();
    this.gameLoop(performance.now());
  }

  toggleMute() {
    sound.init();
    const next = !sound.muted;
    sound.setMuted(next);
    const btn = document.getElementById('mute-btn');
    if (btn) btn.textContent = next ? '🔇' : '🔊';
    btn && btn.classList.toggle('muted', next);
  }

  bindMuteButton() {
    const btn = document.getElementById('mute-btn');
    if (btn) {
      btn.addEventListener('click', () => { sound.init(); this.toggleMute(); });
    }
  }

  bindPauseButton() {
    const btn = document.getElementById('touch-pause');
    if (!btn) return;
    const toggle = (e) => {
      e.preventDefault();
      if (this.state === STATE.PLAYING) this.state = STATE.PAUSED;
      else if (this.state === STATE.PAUSED) this.state = STATE.PLAYING;
      sound.resume();
    };
    btn.addEventListener('touchstart', toggle, { passive: false });
    btn.addEventListener('mousedown', toggle);
  }

  setupInput() {
    document.addEventListener('keydown', (e) => {
      const key = e.key;
      const gameKeys = ['w','W','a','A','s','S','d','D','j','J','p','P','m','M',
        'ArrowUp','ArrowDown','ArrowLeft','ArrowRight','0',')'];
      if (gameKeys.includes(key)) e.preventDefault();
      // Store both original and lowercase to handle Caps Lock / Shift
      this.keys[key] = true;
      if (key.length === 1) this.keys[key.toLowerCase()] = true;
      const pk = key.toLowerCase();
      if (pk === 'p') {
        if (this.state === STATE.PLAYING) this.state = STATE.PAUSED;
        else if (this.state === STATE.PAUSED) this.state = STATE.PLAYING;
      }
      if (pk === 'm') this.toggleMute();
      if (pk === 'enter' || key === ' ') sound.resume();
    });
    document.addEventListener('keyup', (e) => {
      const key = e.key;
      this.keys[key] = false;
      if (key.length === 1) this.keys[key.toLowerCase()] = false;
    });

    // Touch fire button
    const fireEl = document.getElementById('touch-fire');
    if (fireEl) {
      const fireStart = (e) => {
        e.preventDefault();
        fireEl.classList.add('active');
        this.keys['j'] = true;
        sound.resume();
      };
      const fireEnd = (e) => {
        e.preventDefault();
        fireEl.classList.remove('active');
        this.keys['j'] = false;
      };
      fireEl.addEventListener('touchstart', fireStart, { passive: false });
      fireEl.addEventListener('mousedown', fireStart);
      fireEl.addEventListener('touchend', fireEnd, { passive: false });
      fireEl.addEventListener('touchcancel', fireEnd, { passive: false });
      fireEl.addEventListener('mouseup', fireEnd);
      fireEl.addEventListener('mouseleave', fireEnd);
    }

    // Joystick controls (axis-based, low dead-zone, generous touch target)
    const jZone = document.getElementById('joystick-zone');
    const jKnob = document.getElementById('joystick-knob');
    const J_RADIUS = 45;
    const DEAD = 8;
    let jTouchId = null;
    let lastTapTime = 0;
    let lastDir = '';

    if (jZone) {
      const clearDir = () => {
        this.keys['w'] = false;
        this.keys['s'] = false;
        this.keys['a'] = false;
        this.keys['d'] = false;
      };

      // Axis-based: pick the dominant axis, so diagonals feel deliberate
      // and a small horizontal wobble doesn't snap the tank sideways.
      const applyAxis = (dx, dy) => {
        clearDir();
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0) this.keys['d'] = true;
          else if (dx < 0) this.keys['a'] = true;
        } else {
          if (dy > 0) this.keys['s'] = true;
          else if (dy < 0) this.keys['w'] = true;
        }
      };

      const resetKnob = () => {
        jKnob.style.transform = 'translate(-50%, -50%)';
        clearDir();
        lastDir = '';
      };

      const handle = (e, isStart) => {
        e.preventDefault();
        let touch = null;
        const list = isStart ? e.changedTouches : e.changedTouches;
        for (const t of list) {
          if (isStart || t.identifier === jTouchId) { touch = t; break; }
        }
        if (!touch) return;
        if (isStart) {
          const now = Date.now();
          // Double-tap (quick second tap near center) toggles pause
          if (now - lastTapTime < 300 && lastTapNearCenter) {
            if (this.state === STATE.PLAYING) this.state = STATE.PAUSED;
            else if (this.state === STATE.PAUSED) this.state = STATE.PLAYING;
            sound.resume();
            lastTapTime = 0;
            return;
          }
          lastTapTime = now;
          jTouchId = touch.identifier;
        }
        const rect = jZone.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = touch.clientX - cx;
        const dy = touch.clientY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (isStart) lastTapNearCenter = dist < 24;

        if (dist < DEAD) {
          if (lastDir !== 'none') { lastDir = 'none'; clearDir(); resetKnob(); }
          return;
        }
        const clampedDist = Math.min(dist, J_RADIUS);
        const kx = (clampedDist / dist) * dx;
        const ky = (clampedDist / dist) * dy;
        jKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
        const ndir = dx > Math.abs(dy) ? (dx > 0 ? 'd' : 'a') : (dy > 0 ? 's' : 'w');
        if (ndir !== lastDir) { lastDir = ndir; applyAxis(dx, dy); }
        sound.resume();
      };

      let lastTapNearCenter = false;
      jZone.addEventListener('touchstart', (e) => handle(e, true), { passive: false });
      jZone.addEventListener('touchmove', (e) => handle(e, false), { passive: false });
      jZone.addEventListener('touchend', (e) => {
        for (const t of e.changedTouches) {
          if (t.identifier === jTouchId) {
            jTouchId = null;
            resetKnob();
            break;
          }
        }
      }, { passive: true });
      jZone.addEventListener('touchcancel', () => {
        jTouchId = null;
        resetKnob();
      }, { passive: true });
    }
  }

  resetLevel(level) {
    this.level = level;
    const src = LEVELS[Math.min(level, LEVELS.length - 1)];
    this.theme = THEMES[src.theme];
    this.map = [];
    for (let r = 0; r < ROWS; r++) {
      this.map[r] = [];
      for (let c = 0; c < COLS; c++) this.map[r][c] = src.map[r][c];
    }
    this.bullets = [];
    this.particles = [];
    this.powerups = [];
    this.enemies = [];
    this.enemiesSpawned = 0;
    const baseTotal = src.totalEnemies || 20;
    this.totalEnemies = this.difficulty === 'easy' ? Math.max(10, baseTotal - 4) : this.difficulty === 'hard' ? baseTotal + 8 : baseTotal;
    this.maxEnemies = this.difficulty === 'easy' ? 3 : this.difficulty === 'hard' ? 6 : 4;
    this.enemySpawnTimer = this.difficulty === 'easy' ? 80 : this.difficulty === 'hard' ? 30 : 60;
    this.powerupTimer = 200;
    this.spawnAnimations = [];
    this.freezeTimer = 0;
    this.hornTimer = 0;
    this.timerItemActive = false;
    this.powerupIndicator.style.display = 'none';
    this.player1 = new Tank(8 * CELL + 1, 24 * CELL + 1, DIR.UP, true, 0);
    this.player1.speed = this.difficulty === 'easy' ? 2.5 : this.difficulty === 'hard' ? 1.5 : 2;
    // 闯关模式保留 P1 洋枪
    this.player1.superBullet = this.campaignMode && this.campaignP1Super;
    if (this.doubleMode) {
      this.player2 = new Tank(17 * CELL + 1, 24 * CELL + 1, DIR.UP, true, 1);
      this.player2.speed = this.difficulty === 'easy' ? 2.5 : this.difficulty === 'hard' ? 1.5 : 2;
      this.player2.superBullet = this.campaignMode && this.campaignP2Super;
    }

    this.state = STATE.PLAYING;
  }

  start(level, doubleMode, difficulty) {
    this.doubleMode = doubleMode;
    this.difficulty = difficulty || 'medium';
    // 单人闯关模式：读取勾选框；新开局时重置跨关进度
    const cb = document.getElementById('campaign-toggle');
    this.campaignMode = cb ? cb.checked : true;
    if (!this.campaignMode) {
      this.campaignScore = 0;
      this.campaignLives = this.difficulty === 'easy' ? 5 : this.difficulty === 'hard' ? 2 : 3;
      this.campaignP1Super = false;
      this.campaignP2Super = false;
    }
    this.score = this.campaignMode ? this.campaignScore : 0;
    this.lives = this.campaignMode ? this.campaignLives : (this.difficulty === 'easy' ? 5 : this.difficulty === 'hard' ? 2 : 3);
    this.resetLevel(level);
    document.getElementById('menu-overlay').style.display = 'none';
    document.getElementById('gameover-overlay').style.display = 'none';
    document.getElementById('level-complete-overlay').style.display = 'none';
    document.getElementById('stage-select').style.display = 'none';
    document.getElementById('difficulty-select').style.display = 'none';
    this.lastTime = performance.now();
  }

  gameLoop(time) {
    // Delta-time: run the sim at a fixed 60Hz regardless of display refresh
    // rate, so movement/shooting feel identical on 60/120/144Hz screens.
    if (!this.lastTime) this.lastTime = time;
    let dt = time - this.lastTime;
    this.lastTime = time;
    if (dt > 250) dt = 250; // tab was hidden; clamp to avoid a huge jump
    this.acc = (this.acc || 0) + dt;
    const STEP = 1000 / 60;
    let steps = 0;
    while (this.acc >= STEP && steps < 4) {
      this.frameCount++;
      if (this.state === STATE.PLAYING) this.update();
      this.acc -= STEP;
      steps++;
    }
    // Decay screen shake (visual only, runs every frame)
    if (this.shakeT > 0) {
      this.shakeT -= dt;
      const k = Math.max(0, this.shakeT / this.shakeMax);
      this.shakeX = (Math.random() * 2 - 1) * this.shakeAmp * k;
      this.shakeY = (Math.random() * 2 - 1) * this.shakeAmp * k;
    } else { this.shakeX = 0; this.shakeY = 0; }

    this.render();
    if (this.state === STATE.PAUSED) this.drawPauseOverlay();
    requestAnimationFrame((t) => this.gameLoop(t));
  }

  triggerShake(amp, ms) {
    this.shakeAmp = amp; this.shakeMax = ms; this.shakeT = ms;
  }

  update() {
    if (this.freezeTimer > 0) {
      this.freezeTimer--;
      if (this.freezeTimer <= 0) {
        this.timerItemActive = false;
        this.powerupIndicator.style.display = 'none';
      }
    }
    if (this.hornTimer > 0) {
      this.hornTimer--;
      if (this.hornTimer <= 0) {
        this.powerupIndicator.style.display = 'none';
      }
    }

    if (this.player1 && this.player1.alive) {
      this.updatePlayer(this.player1, this.keys, {
        up:'w', down:'s', left:'a', right:'d', fire:'j'
      });
    } else if (this.player1 && !this.player1.alive && !this.player1.spawning) {
      // 仅当 P2 未存活（或单人模式）且还有生命时才重生 P1
      const p2Dead = !this.player2 || (!this.player2.alive && !this.player2.spawning);
      if ((!this.doubleMode || p2Dead) && this.lives > 0) {
        this.lives--;
        this.respawnPlayer(this.player1, 8);
      }
    }

    if (this.doubleMode && this.player2) {
      if (this.player2.alive) {
        this.updatePlayer(this.player2, this.keys, {
          up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight', fire:'0'
        });
      } else if (!this.player2.alive && !this.player2.spawning) {
        // 仅当 P1 仍存活且还有生命时才重生 P2
        if (this.player1 && this.player1.alive && this.lives > 0) {
          this.lives--;
          this.respawnPlayer(this.player2, 17);
        }
      }
    }

    if (this.freezeTimer <= 0) {
      this.updateEnemies();
      this.trySpawnEnemy();
    }
    this.updateBullets();
    this.updateParticles();
    this.updatePowerups();
    this.checkGameOver();
    this.updateHUD();
  }

  updatePlayer(player, keys, controls) {
    if (player.spawning) {
      player.spawnTimer--;
      if (player.spawnTimer <= 0) {
        player.spawning = false;
        player.alive = true;
        player.invincible = 90;
      }
      return;
    }

    let dx = 0, dy = 0, newDir = player.dir;
    if (keys[controls.up]) { dy = -1; newDir = DIR.UP; }
    else if (keys[controls.down]) { dy = 1; newDir = DIR.DOWN; }
    else if (keys[controls.left]) { dx = -1; newDir = DIR.LEFT; }
    else if (keys[controls.right]) { dx = 1; newDir = DIR.RIGHT; }

    if (dx !== 0 || dy !== 0) {
      player.dir = newDir;
      const nx = player.x + dx * player.speed;
      const ny = player.y + dy * player.speed;
      if (this.canMove(nx, ny, player.size, player)) {
        player.x = nx; player.y = ny;
      } else {
        if (dx !== 0 && this.canMove(nx, player.y, player.size, player)) player.x = nx;
        if (dy !== 0 && this.canMove(player.x, ny, player.size, player)) player.y = ny;
      }
    }

    player.x = Math.max(0, Math.min(W - player.size, player.x));
    player.y = Math.max(0, Math.min(H - player.size, player.y));

    if (keys[controls.fire] && player.fireCooldown <= 0) {
      this.fireBullet(player);
      player.fireCooldown = player.superBullet ? 8 : 20;
    }
    if (player.fireCooldown > 0) player.fireCooldown--;
    if (player.invincible > 0) player.invincible--;
  }

  respawnPlayer(player, col) {
    player.x = col * CELL + 1;
    player.y = 24 * CELL + 1;
    player.dir = DIR.UP;
    player.spawning = true;
    player.spawnTimer = 60;
    player.alive = false;
    player.invincible = 120;
    this.spawnAnimations.push({ x: player.x, y: player.y, timer: 60 });
    sound.play('spawn');
  }

  updateEnemies() {
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (!e.alive) { this.enemies.splice(i, 1); continue; }

      if (e.spawning) {
        e.spawnTimer--;
        if (e.spawnTimer <= 0) { e.spawning = false; e.alive = true; }
        continue;
      }

      if (e.invincible > 0) e.invincible--;

      e.moveTimer--;
      if (e.moveTimer <= 0) {
        e.moveTimer = 60 + Math.floor(Math.random() * 120);
        let target = this.player1;
        if (this.doubleMode && this.player2 && this.player2.alive && Math.random() < 0.5) target = this.player2;
        if (Math.random() < 0.35 && target && target.alive) {
          const dx = target.x - e.x, dy = target.y - e.y;
          if (Math.abs(dx) > Math.abs(dy)) e.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
          else e.dir = dy > 0 ? DIR.DOWN : DIR.UP;
        } else {
          e.dir = Math.floor(Math.random() * 4);
        }
      }

      const nx = e.x + DX[e.dir] * e.speed;
      const ny = e.y + DY[e.dir] * e.speed;
      if (this.canMove(nx, ny, e.size, e)) { e.x = nx; e.y = ny; }
      else { e.moveTimer = 0; }

      e.x = Math.max(0, Math.min(W - e.size, e.x));
      e.y = Math.max(0, Math.min(H - e.size, e.y));

      e.shootTimer--;
      if (e.shootTimer <= 0) {
        if (Math.random() < 0.5) this.fireBullet(e);
        e.shootTimer = 60 + Math.floor(Math.random() * 120);
      }
    }
  }

  trySpawnEnemy() {
    if (this.enemiesSpawned >= this.totalEnemies) return;
    if (this.enemies.filter(e => e.alive || e.spawning).length >= this.maxEnemies) return;
    this.enemySpawnTimer--;
    if (this.enemySpawnTimer <= 0) {
      const spawn = this.enemySpawnPoints[Math.floor(Math.random() * 3)];
      const ex = spawn.x * CELL, ey = spawn.y * CELL;
      if (!this.isSpawnClear(ex, ey)) { this.enemySpawnTimer = 5; return; }

      const lvl = Math.min(this.level, 4);
      const diff = this.difficulty;
      const diffMod = diff === 'easy' ? -0.08 : diff === 'hard' ? 0.08 : 0;
      const speedMul = diff === 'easy' ? 0.6 : diff === 'hard' ? 1.3 : 1.0;
      const roll = Math.random();
      let typeData;
      const nChance = 0.25 + lvl * 0.03 + diffMod;
      const aChance = 0.5 + lvl * 0.04 + diffMod;
      if (roll < nChance) typeData = { type: ENEMY_TYPE.NORMAL, speed: 1.0 * speedMul, hp: diff === 'hard' ? 3 : 2, color: '#C0C0C0', trackColor: '#888', barrelColor: '#aaa', score: 150, bodySize: 26 };
      else if (roll < aChance) typeData = { type: ENEMY_TYPE.ARMOR, speed: 0.6 * speedMul, hp: diff === 'hard' ? 4 : diff === 'easy' ? 2 : 3, color: '#8B0000', trackColor: '#555', barrelColor: '#666', score: 300, bodySize: 28 };
      else typeData = { type: ENEMY_TYPE.FAST, speed: 2.5 * speedMul, hp: diff === 'hard' ? 2 : 1, color: '#DAA520', trackColor: '#B8860B', barrelColor: '#B8860B', score: 200, bodySize: 24 };

      const enemy = new Tank(ex + 1, ey + 1, DIR.DOWN, false, typeData);
      this.enemies.push(enemy);
      this.enemiesSpawned++;
      this.enemySpawnTimer = 60 + Math.floor(Math.random() * 40);
      this.spawnAnimations.push({ x: ex, y: ey, timer: 60 });
      if (this.enemiesSpawned <= 3) sound.play('spawn');
    }
  }

  isSpawnClear(x, y) {
    const size = 28;
    for (const e of this.enemies) if (Math.abs(e.x-x) < size && Math.abs(e.y-y) < size) return false;
    if (this.player1 && this.player1.alive && Math.abs(this.player1.x-x) < size && Math.abs(this.player1.y-y) < size) return false;
    if (this.player2 && this.player2.alive && Math.abs(this.player2.x-x) < size && Math.abs(this.player2.y-y) < size) return false;
    return true;
  }

  fireBullet(tank) {
    const size = 6;
    const isSuper = tank.superBullet;
    let bx = tank.x + tank.size / 2 - size / 2;
    let by = tank.y + tank.size / 2 - size / 2;
    switch (tank.dir) {
      case DIR.UP: by = tank.y - size - 1; break;
      case DIR.DOWN: by = tank.y + tank.size + 1; break;
      case DIR.LEFT: bx = tank.x - size - 1; break;
      case DIR.RIGHT: bx = tank.x + tank.size + 1; break;
    }

    const bSpeed = isSuper ? 6 : 4;
    const b = new Bullet(bx, by, tank.dir, tank, bSpeed);
    b.superBullet = !!isSuper;
    this.bullets.push(b);
    sound.play(isSuper ? 'superShoot' : 'shoot');
    // Muzzle flash: a few bright particles at the barrel tip
    const fx = bx + size / 2, fy = by + size / 2;
    const n = isSuper ? 6 : 3;
    for (let i = 0; i < n; i++) {
      this.particles.push({
        x: fx, y: fy,
        vx: DX[tank.dir] * (1 + Math.random()) + (Math.random() - 0.5) * 1.5,
        vy: DY[tank.dir] * (1 + Math.random()) + (Math.random() - 0.5) * 1.5,
        life: 6 + Math.random() * 5, maxLife: 12,
        size: 2 + Math.random() * 2,
        color: isSuper ? '#FFD700' : '#fff'
      });
    }
    if (tank.isPlayer) this.triggerShake(isSuper ? 2 : 1, 60);
  }

  updateBullets() {
    if (this.state !== STATE.PLAYING) return;
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.x += DX[b.dir] * b.speed;
      b.y += DY[b.dir] * b.speed;

      if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) {
        this.bullets.splice(i, 1);
        continue;
      }

      let destroyed = false;
      const bx = Math.floor(b.x / CELL), by = Math.floor(b.y / CELL);
      const bx2 = Math.floor((b.x + b.size - 1) / CELL);
      const by2 = Math.floor((b.y + b.size - 1) / CELL);

      for (let ty = by; ty <= by2; ty++) {
        for (let tx = bx; tx <= bx2; tx++) {
          if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) continue;
          const tile = this.map[ty][tx];

          if (tile === TILE.BASE) {
            this.destroyBase();
            destroyed = true;
          } else if (tile === TILE.BRICK || tile === TILE.BASE_WALL) {
            this.map[ty][tx] = TILE.EMPTY;
            this.addExplosion(tx * CELL, ty * CELL, CELL, CELL);
            sound.play('hit');
            if (!b.superBullet) destroyed = true;
          } else if (tile === TILE.STEEL) {
            if (b.superBullet) {
              this.map[ty][tx] = TILE.EMPTY;
              this.addExplosion(tx * CELL, ty * CELL, CELL, CELL);
              sound.play('hit');
            } else {
              sound.play('hit');
              destroyed = true;
            }
          }
          if (destroyed && !b.superBullet) break;
        }
        if (destroyed && !b.superBullet) break;
      }

      if (destroyed) { this.bullets.splice(i, 1); continue; }

      let hitTank = null;
      const isPlayerBullet = b.owner && b.owner.isPlayer;

      if (isPlayerBullet) {
        for (let k = 0; k < this.enemies.length; k++) {
          const enemy = this.enemies[k];
          if (!enemy || !enemy.alive || enemy.spawning) continue;
          if (this.checkRectCollision(b.x, b.y, b.size, b.size, enemy.x, enemy.y, enemy.size, enemy.size)) {
            hitTank = enemy;
            break;
          }
        }
      } else {
        const p1 = this.player1, p2 = this.player2;
        if (p1 && p1.alive && !p1.spawning && this.checkRectCollision(b.x, b.y, b.size, b.size, p1.x, p1.y, p1.size, p1.size)) {
          hitTank = p1;
        }
        if (!hitTank && p2 && p2.alive && !p2.spawning && this.checkRectCollision(b.x, b.y, b.size, b.size, p2.x, p2.y, p2.size, p2.size)) {
          hitTank = p2;
        }
      }

      if (hitTank) {
        this.hitTank(hitTank, b);
        if (!b.superBullet) this.bullets.splice(i, 1);
      }
    }
  }

  hitTank(tank, bullet) {
    if (tank.invincible > 0) { sound.play('hit'); return; }
    if (tank.lightningShield) {
      sound.play('hit');
      tank.lightningShield = false;
      return;
    }

    tank.hp--;
    this.addExplosion(tank.x + tank.size/2, tank.y + tank.size/2, tank.size, tank.size);

    if (tank.hp <= 0) {
      tank.alive = false;
      sound.play('explosion');
      this.addExplosion(tank.x + tank.size/2, tank.y + tank.size/2, tank.size + 20, tank.size + 20);
      this.triggerShake(tank.isPlayer ? 7 : 4, tank.isPlayer ? 260 : 160);

      if (!tank.isPlayer) {
        this.score += tank.scoreValue || 100;
        if (Math.random() < 0.18) this.spawnPowerup(tank.x, tank.y);
        // 全部敌人消灭 → 过关
        if (this.enemiesSpawned >= this.totalEnemies &&
            this.enemies.filter(e => e.alive || e.spawning).length === 0) {
          this.completeLevel();
        }
      }
    } else {
      sound.play('hit');
    }
  }

  destroyBase() {
    if (this.state !== STATE.PLAYING) return; // 避免重复触发
    for (let r = 24; r < 26; r++)
      for (let c = 12; c < 14; c++) this.map[r][c] = TILE.EMPTY;
    this.addExplosion(12*CELL+CELL/2, 24*CELL+CELL/2, 2*CELL, 2*CELL);
    sound.play('explosion');
    this.triggerShake(10, 400);
    this.gameOver();
  }

  gameOver() {
    this.state = STATE.GAME_OVER;
    document.getElementById('gameover-overlay').style.display = 'flex';
    document.getElementById('final-score').textContent = this.score;
    document.getElementById('final-stage').textContent = this.level + 1;
    sound.play('gameover');
  }

  completeLevel() {
    if (this.state !== STATE.PLAYING) return;
    this.state = STATE.LEVEL_COMPLETE;
    // 闯关模式：保存跨关进度
    if (this.campaignMode) {
      this.campaignScore = this.score;
      this.campaignLives = Math.max(0, this.lives);
      this.campaignP1Super = !!(this.player1 && this.player1.superBullet);
      this.campaignP2Super = !!(this.player2 && this.player2.superBullet);
    }
    document.getElementById('level-complete-overlay').style.display = 'flex';
    document.getElementById('stage-score').textContent = this.score;
    sound.play('levelUp');
  }

  checkGameOver() {
    if (this.state !== STATE.PLAYING) return;
    if (this.enemiesSpawned >= this.totalEnemies && this.enemies.filter(e => e.alive || e.spawning).length === 0) {
      this.completeLevel();
      return;
    }
    const p1Dead = this.player1 && !this.player1.alive && !this.player1.spawning;
    const p2Dead = this.player2 && !this.player2.alive && !this.player2.spawning;
    if (this.lives < 0 || (p1Dead && (!this.doubleMode || p2Dead))) {
      this.gameOver();
    }
  }

  canMove(x, y, size, tank) {
    if (x < 0 || y < 0 || x + size > W || y + size > H) return false;
    const left = Math.floor(x / CELL), right = Math.floor((x + size - 1) / CELL);
    const top = Math.floor(y / CELL), bottom = Math.floor((y + size - 1) / CELL);
    for (let ty = top; ty <= bottom; ty++) {
      for (let tx = left; tx <= right; tx++) {
        if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return false;
        const tile = this.map[ty][tx];
        if (tile === TILE.BRICK || tile === TILE.STEEL || tile === TILE.BASE || tile === TILE.BASE_WALL || tile === TILE.WATER) return false;
      }
    }
    const others = [];
    if (this.player1 && this.player1 !== tank && this.player1.alive && !this.player1.spawning) others.push(this.player1);
    if (this.player2 && this.player2 !== tank && this.player2.alive && !this.player2.spawning) others.push(this.player2);
    for (const e of this.enemies) if (e !== tank && e.alive && !e.spawning) others.push(e);
    for (const other of others) {
      if (this.checkRectCollision(x, y, size, size, other.x, other.y, other.size, other.size)) return false;
    }
    return true;
  }

  checkRectCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  }

  addExplosion(x, y, w, h) {
    const count = Math.min(Math.max(6, w/4), 16);
    for (let i = 0; i < count; i++) {
      this.particles.push({
        x: x + (Math.random() - 0.5) * w,
        y: y + (Math.random() - 0.5) * h,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.5) * 5,
        life: 15 + Math.random() * 25,
        maxLife: 40,
        size: 2 + Math.random() * 6,
        color: ['#FF6B35','#FFD700','#FF4444','#fff'][Math.floor(Math.random()*4)]
      });
    }
  }

  spawnPowerup(x, y) {
    const types = [POWERUP.LIGHTNING, POWERUP.SUPER_BULLET, POWERUP.STAR, POWERUP.BOMB, POWERUP.TIMER, POWERUP.HORN];
    const type = types[Math.floor(Math.random() * types.length)];
    const col = Math.floor(x / CELL);
    const row = Math.floor(y / CELL);
    this.powerups.push({
      x: Math.max(0, Math.min(W - 28, col * CELL + 2)),
      y: Math.max(0, Math.min(H - 28, row * CELL + 2)),
      type: type,
      life: 600,
      blinking: false
    });
  }

  updatePowerups() {
    for (let i = this.powerups.length - 1; i >= 0; i--) {
      const p = this.powerups[i];
      p.life--;
      if (p.life <= 0) { this.powerups.splice(i, 1); continue; }
      p.blinking = p.life < 120 && Math.floor(p.life / 8) % 2 === 0;

      const checkTank = (tank) => {
        if (!tank || !tank.alive || tank.spawning) return false;
        return this.checkRectCollision(p.x, p.y, 26, 26, tank.x, tank.y, tank.size, tank.size);
      };

      if (checkTank(this.player1)) { this.applyPowerup(this.player1, p.type); this.powerups.splice(i, 1); sound.play('powerup'); continue; }
      if (this.doubleMode && checkTank(this.player2)) { this.applyPowerup(this.player2, p.type); this.powerups.splice(i, 1); sound.play('powerup'); continue; }

      for (const e of this.enemies) {
        if (!e.alive || e.spawning) continue;
        if (this.checkRectCollision(p.x, p.y, 26, 26, e.x, e.y, e.size, e.size)) {
          if (p.type === POWERUP.BOMB) {
            this.addExplosion(e.x, e.y, e.size + 20, e.size + 20);
            e.alive = false;
            sound.play('explosion');
          }
          this.powerups.splice(i, 1);
          break;
        }
      }
    }
  }

  applyPowerup(player, type) {
    switch (type) {
      case POWERUP.LIGHTNING:
        player.lightningShield = true;
        this.showPowerupText('闪电护罩!');
        break;
      case POWERUP.SUPER_BULLET:
        player.superBullet = true;
        this.showPowerupText('洋枪!');
        break;
      case POWERUP.STAR:
        player.starCount = (player.starCount || 0) + 1;
        if (player.starCount >= 3) {
          player.superBullet = true;
          player.fireCooldown = Math.max(5, player.fireCooldown - 3);
          this.showPowerupText('超级洋枪!');
          player.starCount = 0;
        } else {
          player.fireCooldown = Math.max(8, (player.fireCooldown || 20) - 4);
          this.showPowerupText('五角星!');
        }
        break;
      case POWERUP.BOMB:
        for (const e of this.enemies) {
          if (e.alive && !e.spawning) {
            e.alive = false;
            this.score += e.scoreValue || 100;
            this.addExplosion(e.x, e.y, e.size + 20, e.size + 20);
          }
        }
        this.enemies = [];
        this.showPowerupText('全屏炸弹!');
        sound.play('explosion');
        break;
      case POWERUP.TIMER:
        this.freezeTimer = 480;
        this.timerItemActive = true;
        this.showPowerupText('定时!');
        sound.play('freeze');
        break;
      case POWERUP.HORN:
        this.hornTimer = 600;
        const hr = [[23,11],[23,12],[23,13],[23,14],[24,11],[24,14],[25,11],[25,14]];
        for (const [r,c] of hr) {
          if (r>=0 && r<ROWS && c>=0 && c<COLS && this.map[r][c] === TILE.EMPTY) {
            this.map[r][c] = TILE.STEEL;
          }
        }
        this.showPowerupText('钢铁基地!');
        break;
    }
  }

  showPowerupText(text) {
    this.powerupIndicator.textContent = text;
    this.powerupIndicator.style.display = 'block';
    setTimeout(() => {
      if (this.powerupIndicator.textContent === text) {
        this.powerupIndicator.style.display = 'none';
      }
    }, 2000);
  }

  updateParticles() {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.spawnAnimations.length - 1; i >= 0; i--) {
      this.spawnAnimations[i].timer--;
      if (this.spawnAnimations[i].timer <= 0) this.spawnAnimations.splice(i, 1);
    }
  }

  updateHUD() {
    document.getElementById('lives-display').textContent = Math.max(0, this.lives);
    document.getElementById('stage-display').textContent = this.level + 1;
    document.getElementById('score-display').textContent = this.score;
    const remaining = this.totalEnemies - this.enemiesSpawned + this.enemies.filter(e => e.alive || e.spawning).length;
    document.getElementById('enemies-display').textContent = Math.max(0, remaining);
  }

  render() {
    const ctx = this.ctx;
    if (this.map.length === 0) {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, W, H);
      return;
    }

    const bg = this.theme ? this.theme.bg : '#1a1a1a';
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    // Screen shake (applies to everything drawn below)
    ctx.save();
    if (this.shakeX || this.shakeY) ctx.translate(this.shakeX, this.shakeY);
    this.drawMap(ctx);
    this.drawPowerups(ctx);

    for (const s of this.spawnAnimations) {
      if (s.timer > 0) {
        const alpha = Math.sin(s.timer * 0.3) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
        ctx.fillRect(s.x, s.y, CELL, CELL);
      }
    }

    if (this.player1 && this.player1.alive) this.player1.draw(ctx);
    if (this.player2 && this.player2.alive && this.doubleMode) this.player2.draw(ctx);
    for (const e of this.enemies) { if (e.alive || e.spawning) e.draw(ctx); }
    for (const b of this.bullets) b.draw(ctx);

    for (const p of this.particles) {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    ctx.restore(); // end screen shake

    if (this.freezeTimer > 0) {
      ctx.fillStyle = 'rgba(100, 180, 255, 0.10)';
      ctx.fillRect(0, 0, W, H);
      // pulsing icy border
      const pulse = 0.5 + Math.sin(this.frameCount * 0.15) * 0.5;
      ctx.strokeStyle = `rgba(150, 210, 255, ${0.25 + pulse * 0.35})`;
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, W - 4, H - 4);
    }
  }

  drawMap(ctx) {
    const t = this.theme;
    const fg = t ? t.floorColor : '#1a1a1a';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const tile = this.map[r][c];
        if (tile === TILE.EMPTY) {
          ctx.fillStyle = fg;
          ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
          continue;
        }
        const x = c * CELL, y = r * CELL;
        switch (tile) {
          case TILE.BRICK: case TILE.BASE_WALL:
            this.drawBrick(ctx, x, y, t);
            break;
          case TILE.STEEL:
            this.drawSteel(ctx, x, y);
            break;
          case TILE.FOREST:
            this.drawForest(ctx, x, y, t);
            break;
          case TILE.WATER:
            this.drawWater(ctx, x, y, t);
            break;
          case TILE.BASE:
            this.drawBase(ctx, x, y);
            break;
        }
      }
    }
  }

  drawBrick(ctx, x, y, t) {
    const wc = t ? t.wallColor : '#8B4513';
    const ba = t ? t.brickAlt : '#A0522D';
    ctx.fillStyle = wc;
    ctx.fillRect(x, y, CELL, CELL);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    const half = CELL / 2;
    ctx.strokeRect(x, y, half, half);
    ctx.strokeRect(x + half + 1, y, half - 1, half);
    ctx.strokeRect(x, y + half + 1, half, half - 1);
    ctx.strokeRect(x + half + 1, y + half + 1, half - 1, half - 1);
    ctx.fillStyle = ba;
    ctx.fillRect(x + 2, y + 2, 3, 3);
    ctx.fillRect(x + half + 3, y + 2, 3, 3);
    ctx.fillRect(x + 2, y + half + 3, 3, 3);
    ctx.fillRect(x + half + 3, y + half + 3, 3, 3);
  }

  drawSteel(ctx, x, y) {
    ctx.fillStyle = '#666';
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = '#808080';
    ctx.fillRect(x+1, y+1, CELL-2, CELL-2);
    ctx.fillStyle = '#999';
    ctx.fillRect(x+3, y+3, CELL-6, CELL-6);
    ctx.fillStyle = '#555';
    ctx.fillRect(x+5, y+5, CELL-10, CELL-10);
    ctx.fillStyle = '#aaa';
    ctx.fillRect(x+2, y+2, 3, 3);
    ctx.fillRect(x+CELL-5, y+2, 3, 3);
    ctx.fillRect(x+2, y+CELL-5, 3, 3);
    ctx.fillRect(x+CELL-5, y+CELL-5, 3, 3);
  }

  drawForest(ctx, x, y, t) {
    const fc = t ? t.forestColor : '#228B22';
    const bg = t ? t.bg : '#1a1a1a';
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = fc;
    for (let i = 0; i < 4; i++) {
      const tx = x + (i % 2) * 14 + 3;
      const ty = y + Math.floor(i/2) * 14 + 3;
      ctx.beginPath();
      ctx.arc(tx + 6, ty + 6, 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#1a5a1a';
    ctx.beginPath();
    ctx.arc(x+8, y+8, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x+22, y+22, 3, 0, Math.PI*2);
    ctx.fill();
  }

  drawWater(ctx, x, y, t) {
    const wc = t ? t.waterColor : '#1E90FF';
    const bg = t ? t.bg : '#1a1a1a';
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = wc;
    ctx.fillRect(x+3, y+3, CELL-6, CELL-6);
    const wave = Math.sin(this.frameCount*0.04 + x*0.1) * 2;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(x+6, y+8+wave, 7, 2);
    ctx.fillRect(x+17, y+18-wave, 7, 2);
  }

  drawBase(ctx, x, y) {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = '#FFD700';
    const cx = x + CELL/2, cy = y + CELL/2;
    ctx.beginPath();
    ctx.moveTo(cx, cy-8); ctx.lineTo(cx+6, cy+2);
    ctx.lineTo(cx+3, cy+2); ctx.lineTo(cx+3, cy+8);
    ctx.lineTo(cx-3, cy+8); ctx.lineTo(cx-3, cy+2);
    ctx.lineTo(cx-6, cy+2); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(cx-2, cy-2, 4, 4);
  }

  drawPowerups(ctx) {
    for (const p of this.powerups) {
      if (p.blinking) continue;
      const px = p.x, py = p.y;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(px, py, 26, 26);
      ctx.fillStyle = '#222';
      ctx.fillRect(px+1, py+1, 24, 24);

      const s = 4;
      switch (p.type) {
        case POWERUP.LIGHTNING:
          ctx.fillStyle = '#00BFFF';
          ctx.fillRect(px+13, py+3, 3, 8);
          ctx.fillRect(px+10, py+6, 6, 3);
          ctx.fillRect(px+13, py+9, 3, 8);
          ctx.fillRect(px+10, py+12, 6, 3);
          break;
        case POWERUP.SUPER_BULLET:
          ctx.fillStyle = '#FF4500';
          ctx.fillRect(px+10, py+3, 6, 3);
          ctx.fillRect(px+12, py+6, 2, 14);
          ctx.fillRect(px+8, py+12, 10, 3);
          break;
        case POWERUP.STAR:
          ctx.fillStyle = '#FFD700';
          for (let i = 0; i < 5; i++) {
            const angle = i * Math.PI * 2 / 5 - Math.PI/2;
            const ax = px+13 + Math.cos(angle)*9;
            const ay = py+13 + Math.sin(angle)*9;
            ctx.fillRect(ax-1, ay-1, 3, 3);
          }
          break;
        case POWERUP.BOMB:
          ctx.fillStyle = '#e74c3c';
          ctx.beginPath();
          ctx.arc(px+13, py+14, 9, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#c0392b';
          ctx.fillRect(px+12, py+3, 2, 5);
          ctx.fillStyle = '#fff';
          ctx.fillRect(px+10, py+10, 6, 2);
          break;
        case POWERUP.TIMER:
          ctx.fillStyle = '#9b59b6';
          ctx.beginPath();
          ctx.arc(px+13, py+13, 10, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.fillRect(px+12, py+6, 2, 7);
          ctx.fillRect(px+12, py+13, 5, 2);
          break;
        case POWERUP.HORN:
          ctx.fillStyle = '#e67e22';
          ctx.fillRect(px+6, py+5, 14, 3);
          ctx.fillRect(px+10, py+8, 6, 10);
          ctx.fillRect(px+6, py+12, 14, 3);
          ctx.fillRect(px+4, py+8, 3, 6);
          ctx.fillRect(px+19, py+8, 3, 6);
          break;
      }
    }
  }

  drawPauseOverlay() {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    const isMobile = 'ontouchstart' in window && window.innerWidth <= 900;
    ctx.fillStyle = '#FFD700';
    ctx.font = '22px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(255,215,0,0.6)'; ctx.shadowBlur = 14;
    ctx.fillText('PAUSED', W/2, H/2 - 12);
    ctx.shadowBlur = 0;
    ctx.font = '8px "Press Start 2P"';
    ctx.fillStyle = '#aab';
    ctx.fillText(isMobile ? 'TAP ❚❚ OR DOUBLE-TAP JOYSTICK' : 'PRESS P TO CONTINUE', W/2, H/2 + 22);
  }
}

// ============================================================
// TANK CLASS
// ============================================================
class Tank {
  constructor(x, y, dir, isPlayer, extra) {
    this.x = x; this.y = y; this.dir = dir; this.isPlayer = isPlayer;
    this.size = 28;
    this.alive = true; this.spawning = true; this.spawnTimer = 60;
    this.invincible = 120; this.fireCooldown = 0;
    this.level = 0; this.hp = 1; this.scoreValue = 100;
    this.moveTimer = 60; this.shootTimer = 60; this.respawnTimer = 0;
    this.starCount = 0;
    this.superBullet = false;
    this.lightningShield = false;

    if (isPlayer) {
      this.id = extra;
      this.color = this.id === 0 ? '#FFD700' : '#2ecc71';
      this.trackColor = this.id === 0 ? '#B8860B' : '#1a8a4a';
      this.barrelColor = this.id === 0 ? '#DAA520' : '#27ae60';
      this.speed = 2;
    } else {
      this.color = extra.color || '#C0C0C0';
      this.trackColor = extra.trackColor || '#888';
      this.barrelColor = extra.barrelColor || '#aaa';
      this.speed = extra.speed || 0.8;
      this.hp = extra.hp || 1;
      this.scoreValue = extra.score || 100;
      this.size = extra.bodySize || 28;
      this.enemyType = extra.type || ENEMY_TYPE.NORMAL;
      this.shootTimer = 60 + Math.floor(Math.random() * 60);
    }
  }

  draw(ctx) {
    if (this.spawning) { this.drawSpawnEffect(ctx); return; }

    const x = this.x, y = this.y, s = this.size, cx = x + s/2, cy = y + s/2;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(this.dir * Math.PI / 2);
    ctx.translate(-cx, -cy);

    if (this.lightningShield) {
      ctx.shadowColor = '#00BFFF';
      ctx.shadowBlur = 10;
    }

    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) {
      ctx.globalAlpha = 0.5;
    }

    const trackW = this.isPlayer ? 6 : 5;
    ctx.fillStyle = this.trackColor;
    ctx.fillRect(x + 1, y + 2, trackW, s - 4);
    ctx.fillRect(x + s - 1 - trackW, y + 2, trackW, s - 4);

    for (let i = 0; i < 4; i++) {
      const ty = y + 3 + i * 6;
      ctx.fillStyle = this.isPlayer ? this.color : '#666';
      ctx.fillRect(x + 2, ty, trackW - 1, 2);
      ctx.fillRect(x + s - trackW + 1, ty, trackW - 1, 2);
    }

    if (this.isPlayer) {
      ctx.fillStyle = this.color;
      ctx.fillRect(x + 7, y + 4, s - 14, s - 8);
      ctx.fillStyle = this.barrelColor;
      ctx.fillRect(x + 9, y + 6, s - 18, 3);
      ctx.fillRect(x + 9, y + s - 9, s - 18, 3);
      ctx.fillStyle = this.barrelColor;
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = this.trackColor;
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = this.barrelColor;
      ctx.fillRect(cx - 2, y - 1, 4, s/2 + 2);
    } else {
      const inset = 3;
      ctx.fillStyle = this.color;
      ctx.fillRect(x + inset + 2, y + inset, s - 2 * inset - 4, s - 2 * inset);
      ctx.fillStyle = this.barrelColor;
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = this.trackColor;
      ctx.beginPath();
      ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = this.barrelColor;
      ctx.fillRect(cx - 1.5, y + 1, 3, s/2);
    }

    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    if (this.lightningShield) {
      ctx.strokeStyle = '#00BFFF';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(this.x - 2, this.y - 2, this.size + 4, this.size + 4);
      ctx.setLineDash([]);
    }
  }

  drawSpawnEffect(ctx) {
    const cx = this.x + this.size/2, cy = this.y + this.size/2;
    const t = this.spawnTimer;
    const alpha = Math.sin(t * 0.2) * 0.5 + 0.5;
    ctx.save();
    ctx.globalAlpha = alpha * 0.8;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(this.x, this.y, this.size, this.size);
    const angle = t * 0.3;
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(-3, -this.size/2, 6, this.size);
    ctx.fillRect(-this.size/2, -3, this.size, 6);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// BULLET CLASS
// ============================================================
class Bullet {
  constructor(x, y, dir, owner, speed) {
    this.x = x; this.y = y; this.dir = dir; this.owner = owner;
    this.speed = speed || 4; this.size = 6; this.superBullet = false;
  }

  draw(ctx) {
    if (this.superBullet) {
      ctx.fillStyle = '#FF4500';
      ctx.fillRect(this.x - 1, this.y - 1, this.size + 2, this.size + 2);
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(this.x, this.y, this.size, this.size);
    } else {
      ctx.fillStyle = '#fff';
      ctx.fillRect(this.x, this.y, this.size, this.size);
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(this.x + 1, this.y + 1, this.size - 2, this.size - 2);
    }
  }
}

// ============================================================
// GLOBAL FUNCTIONS
// ============================================================
let game = null;

function initGame() {
  if (!game) { game = new BattleCity(); sound.init(); }
}

function startGame(level, doubleMode, difficulty) {
  initGame();
  game.start(level - 1, !!doubleMode, difficulty);
}

function showStageSelect() {
  initGame();
  sound.play('select');
  const container = document.getElementById('stage-buttons');
  container.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'stage-btn';
    const themeName = THEMES[LEVELS[i-1].theme].name;
    btn.innerHTML = '<div class="stage-num">STAGE ' + i + '</div><div class="stage-theme">' + themeName + '</div>';
    const stageIdx = i - 1;
    btn.onclick = function() { sound.play('select'); showDifficultySelect(stageIdx, false); };
    container.appendChild(btn);
  }
  document.getElementById('stage-select').style.display = 'flex';
  document.getElementById('menu-overlay').style.display = 'none';
}

let pendingGameConfig = null;

function showDifficultySelect(level, doubleMode) {
  pendingGameConfig = { level, doubleMode };
  sound.play('select');
  document.getElementById('difficulty-select').style.display = 'flex';
  document.getElementById('menu-overlay').style.display = 'none';
  document.getElementById('stage-select').style.display = 'none';
}

function startWithDifficulty(difficulty) {
  if (pendingGameConfig) {
    sound.play('select');
    startGame(pendingGameConfig.level + 1, pendingGameConfig.doubleMode, difficulty);
    pendingGameConfig = null;
  }
}

function backToMenu() {
  sound.play('select');
  if (game) game.state = STATE.MENU;
  pendingGameConfig = null;
  document.getElementById('menu-overlay').style.display = 'flex';
  document.getElementById('gameover-overlay').style.display = 'none';
  document.getElementById('level-complete-overlay').style.display = 'none';
  document.getElementById('stage-select').style.display = 'none';
  document.getElementById('difficulty-select').style.display = 'none';
}

function nextLevel() {
  sound.play('select');
  if (game) {
    const nextLvl = game.level + 1;
    if (nextLvl >= LEVELS.length) {
      // 已通关最后一关
      backToMenu();
      return;
    }
    document.getElementById('level-complete-overlay').style.display = 'none';
    game.lives = game.campaignMode ? game.campaignLives : (game.difficulty === 'easy' ? 5 : game.difficulty === 'hard' ? 2 : 3);
    game.resetLevel(nextLvl);
  }
}

window.addEventListener('load', () => { initGame(); });

// Unlock audio on the first user gesture (browsers require a user action)
function unlockAudio() { sound.init(); sound.resume(); }
window.addEventListener('pointerdown', unlockAudio, { once: true });
window.addEventListener('keydown', unlockAudio, { once: true });
</script>
